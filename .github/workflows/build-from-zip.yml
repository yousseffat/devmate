name: Build EXE from ZIP
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath project -Force
          $pkg = Get-ChildItem -Path project -Recurse -Filter package.json | Where-Object { $_.FullName -notmatch 'node_modules' } | Sort-Object { $_.FullName.Length } | Select-Object -First 1
          "PROJECT_DIR=$($pkg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build
      - name: Make installer
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DevMate-Windows-Installer
          path: ${{ env.PROJECT_DIR }}/release/*.exe
